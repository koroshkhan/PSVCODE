name: Build PS5FileDump for Windows (Cached)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "برچسب نسخه (مثلاً v2.2.1)"
        required: true
        default: "v2.2.1"

env:
  CARGO_TERM_COLOR: always
  APP_NAME: PS5FileDump

jobs:
  test-and-build-windows:
    name: Test & Build Windows EXE (x86_64)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache rustup toolchain & Windows target
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
          key: windows-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            windows-rustup-

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ps5filedump-win-x64

      - name: Run tests
        run: cargo test --all-targets

      - name: Build optimized Windows release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows ZIP and SHA256 checksum
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "${{ inputs.version_tag }}" }
          $pkgName = "${{ env.APP_NAME }}-$tag-win64"
          $stage = "stage/$pkgName"
          New-Item -ItemType Directory -Force -Path $stage, "dist" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/*.exe" "$stage/"
          if (Test-Path "README.md") { Copy-Item "README.md" "$stage/" }
          $zipPath = "dist/$pkgName.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkgName.zip" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5fd-win
          path: dist/*

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
