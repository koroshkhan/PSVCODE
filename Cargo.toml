[package]
name = "PS5FileDump"
version = "2.2.1"
edition = "2021"
license = "GPL-3.0"
description = "PS5FileDump - Windows Native GUI & CLI PS5 Dump Analyzer, Stream Converter, Asset Packer, Dump Editor, Library & PS5/NAS Suite"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.29", default-features = true }
rfd = "0.15"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
zstd = "0.13"
lz4_flex = "0.11"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
